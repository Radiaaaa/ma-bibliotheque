name: Goodreads Sync

on:
  repository_dispatch:
    types: [sync-goodreads]

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install axios fast-xml-parser

      - name: Run sync script
        env:
          GOODREADS_USER_ID: ${{ github.event.client_payload.goodreads_user_id }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: node scripts/sync-goodreads.js

      - name: Commit and push books.json
        run: |
          git config --global user.name "Goodreads Sync Bot"
          git config --global user.email "sync-bot@github-actions"
          git add data/books.json
          git diff --staged --quiet || git commit -m "chore: sync Goodreads library [skip ci]"
          git push
